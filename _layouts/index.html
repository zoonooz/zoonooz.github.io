<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b2025">
    <meta name="description" content="Amornchai Kanokpullwad — software engineer building mobile apps. Portfolio and blog.">
    <meta property="og:title" content="{{ page.title | default: site.name }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    {% if page.thumbnail %}
    <meta property="og:image" content="{{ site.url }}{{ page.thumbnail }}">
    {% endif %}
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">

    <title>{% if page.layout == "post" %}{{ page.title }} | {{ site.name }}{% else %}{{ page.title | default: site.name }}{% endif %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap core CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="/css/main.css" rel="stylesheet">
    <link href="/css/syntax.css" rel="stylesheet">
  </head>

  <body>

    <div class="navbg">
      <nav class="navbar container">
        <div class="container-fluid">
          <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#main-nav" aria-expanded="false">
              <span class="sr-only">Toggle navigation</span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/">ZOONREF</a>
          </div>

          <!-- Collect the nav links, forms, and other content for toggling -->
          <div class="collapse navbar-collapse" id="main-nav">
            <ul class="nav navbar-nav navbar-right">
              <li{% if page.url contains "/blog" %} class="active"{% endif %}><a href="/blog">blog</a></li>
              <li{% if page.url contains "/portfolio" %} class="active"{% endif %}><a href="/portfolio">portfolio</a></li>
              <li><a href="mailto:zoonref@gmail.com">contact</a></li>
              <li class="collapse-hide"><a class="glyphicon glyphicon-signal" aria-hidden="true"></a></li>
            </ul>
          </div><!-- /.navbar-collapse -->
        </div>
      </nav>
    </div>

    <div id="wrap">
      <main id="main">
        {{ content }}
      </main>
    </div>

    <footer class="footer">
      <p class="text-center">Made with ❤️ by <b>Amornchai Kanokpullwad</b> · © {{ site.time | date: "%Y" }}</p>
    </footer>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/bootstrap.min.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
  </body>
</html>
